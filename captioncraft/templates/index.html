<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CaptionCraft v2</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Dancing+Script:wght@600;700&family=Montserrat:wght@400;700&family=Space+Mono&family=Playfair+Display:wght@700&family=Caveat:wght@600&display=swap" rel="stylesheet"/>
</head>
<body>

<header class="topbar">
  <div class="logo-wrap">
    <span class="logo-text">CaptionCraft</span>
    <span class="logo-v">v2</span>
  </div>
  <div class="topbar-right">
    <span id="global-status" class="status-pill idle"><span class="dot"></span>Ready</span>
    <button class="btn btn-export-top" id="btn-export-top" disabled onclick="exportVideo()">🚀 Export</button>
  </div>
</header>

<div class="workspace">

  <!-- LEFT: Style Panel -->
  <aside class="panel-left">
    <div class="section-title">Templates</div>

    <div class="style-list" id="style-list">
      {% for key, s in styles.items() %}
      <div class="style-card {% if key == 'mehfil' %}active{% endif %}" data-style="{{ key }}" onclick="selectStyle('{{ key }}', this)">
        <div class="style-thumb" id="thumb-{{ key }}">
          <canvas class="thumb-canvas" width="260" height="90" id="canvas-thumb-{{ key }}"></canvas>
        </div>
        <div class="style-card-footer">
          <span class="style-name">{{ s.name }}</span>
          <span class="style-tag tag-{{ s.tag|lower|replace('-','') }}">{{ s.tag }}</span>
        </div>
      </div>
      {% endfor %}
    </div>
  </aside>

  <!-- CENTER: Video Preview -->
  <main class="panel-center">
    <div class="preview-wrap" id="preview-wrap">
      <div class="drop-overlay" id="drop-overlay">
        <div class="drop-icon">🎬</div>
        <div class="drop-text"><strong>Drop video here</strong> or click to browse</div>
        <div class="drop-sub">MP4 · MOV · AVI · MKV</div>
        <input type="file" id="file-input" accept=".mp4,.mov,.avi,.mkv"/>
      </div>
      <video id="main-video" style="display:none;" playsinline></video>
      <canvas id="caption-canvas" style="display:none;"></canvas>
    </div>

    <!-- Video controls -->
    <div class="video-controls" id="video-controls" style="display:none;">
      <button class="ctrl-btn" onclick="togglePlay()" id="btn-play">▶</button>
      <div class="progress-track" id="progress-track" onclick="seekVideo(event)">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <span class="time-display" id="time-display">0:00 / 0:00</span>
      <button class="ctrl-btn" onclick="toggleMute()">🔊</button>
    </div>

    <!-- Size & Position controls -->
    <div class="adjust-bar" id="adjust-bar" style="display:none;">
      <div class="adjust-group">
        <label>Size</label>
        <input type="range" min="50" max="200" value="100" id="size-slider" oninput="updateSizeScale(this.value)"/>
        <span id="size-val">100%</span>
      </div>
      <div class="adjust-group">
        <label>Position</label>
        <div class="pos-btns">
          <button class="pos-btn" onclick="setPosition('top', this)">Top</button>
          <button class="pos-btn active" onclick="setPosition('bottom', this)">Bottom</button>
          <button class="pos-btn" onclick="setPosition('center', this)">Center</button>
        </div>
      </div>
      <div class="adjust-group">
        <label>Line 1 Font</label>
        <select class="font-select" onchange="changeFont1(this.value)">
          <option value="">Auto</option>
          <option value="Anton">Anton</option>
          <option value="BebasNeue">Bebas Neue</option>
          <option value="Montserrat">Montserrat</option>
          <option value="SpaceMono">Space Mono</option>
          <option value="PlayfairDisplay">Playfair Display</option>
        </select>
      </div>
      <div class="adjust-group">
        <label>Line 2 Font</label>
        <select class="font-select" onchange="changeFont2(this.value)">
          <option value="">Auto</option>
          <option value="DancingScript">Dancing Script</option>
          <option value="Caveat">Caveat</option>
          <option value="Anton">Anton</option>
          <option value="Montserrat">Montserrat</option>
          <option value="PlayfairDisplay">Playfair Display</option>
        </select>
      </div>
    </div>
  </main>

  <!-- RIGHT: Captions Panel -->
  <aside class="panel-right">
    <div class="section-title">
      Captions
      <span id="word-count" class="count-badge" style="display:none;"></span>
    </div>

    <div class="transcribe-wrap">
      <button class="btn btn-transcribe" id="btn-transcribe" disabled onclick="transcribeVideo()">
        🎙 Auto Transcribe
      </button>
      <div class="progress-line" id="t-progress" style="display:none;"><div class="progress-line-fill"></div></div>
    </div>

    <div id="empty-captions" class="empty-state">
      <div class="empty-icon">🎞️</div>
      <p>Upload a video then click<br/><strong>Auto Transcribe</strong></p>
    </div>

    <div id="caption-editor" style="display:none; flex:1; overflow:hidden; display:none; flex-direction:column;">
      <div class="cap-actions">
        <button class="cap-act-btn" onclick="addCaption()">+ Add</button>
        <button class="cap-act-btn danger" onclick="clearCaptions()">Clear</button>
      </div>
      <div class="caption-scroll" id="caption-scroll"></div>
    </div>

    <div class="export-footer">
      <button class="btn btn-export-full" id="btn-export-full" disabled onclick="exportVideo()">🚀 Export with Captions</button>
      <div class="export-progress-line" id="e-progress" style="display:none;"><div class="progress-line-fill"></div></div>
      <div id="export-msg" class="export-msg"></div>
      <a id="download-link" class="btn btn-download" style="display:none;">⬇ Download MP4</a>
    </div>
  </aside>

</div>

<script>
  const STYLES = {{ styles | tojson }};
</script>
<script src="/static/js/main.js"></script>
</body>
</html>
